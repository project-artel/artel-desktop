name: runtime

# Builds the ARTEL runtime bundle for six targets on native runners, smoke-tests each one,
# and on a runtime-v* tag attaches the archives to a GitHub release. See runtime/README.md.

on:
  push:
    tags:
      - 'runtime-v*'
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default 0.0.0-ci.<run number>)'
        required: false
      orchestration_ref:
        description: 'artel-orchestration-server branch, tag or SHA'
        default: develop
      agent_server_ref:
        description: 'artel-agent-server branch, tag or SHA'
        default: develop
      home_ref:
        description: 'artel-home branch, tag or SHA'
        default: develop
      skip_services:
        description: 'Smoke-test postgres and pgvector only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTEL_ORCHESTRATION_REF: ${{ inputs.orchestration_ref || 'develop' }}
  ARTEL_AGENT_SERVER_REF: ${{ inputs.agent_server_ref || 'develop' }}
  ARTEL_HOME_REF: ${{ inputs.home_ref || 'develop' }}

jobs:
  common:
    name: jar, home dist and agent-server source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Resolve version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/runtime-v* ]]; then
            version="${GITHUB_REF#refs/tags/runtime-v}"
          else
            version="${VERSION_INPUT:-0.0.0-ci.$GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build common parts
        run: bash runtime/build.sh common
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-common
          path: runtime/build/common
          retention-days: 3
          if-no-files-found: error

  bundle:
    name: bundle ${{ matrix.target }}
    needs: common
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # win32-arm64 is allowed to fail until its first green run; the other five must pass.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, experimental: false }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, experimental: false }
          # macos-13 was retired in 2025; macos-15-intel is the remaining Intel image.
          - { target: darwin-x64, runner: macos-15-intel, experimental: false }
          - { target: darwin-arm64, runner: macos-14, experimental: false }
          - { target: win32-x64, runner: windows-latest, msvc: x64, experimental: false }
          - { target: win32-arm64, runner: windows-11-arm, msvc: arm64, experimental: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-common
          path: runtime/build/common
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/build/cache
          key: runtime-downloads-${{ matrix.target }}-${{ hashFiles('runtime/versions.env') }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Build static OpenSSL for Windows arm64
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = 'arm64-windows-static-md'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "openssl:$triplet" --classic
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          foreach ($file in @('include/openssl/ssl.h', 'lib/libssl.lib', 'lib/libcrypto.lib')) {
            if (!(Test-Path (Join-Path $opensslRoot $file))) {
              throw "OpenSSL build output missing: $file"
            }
          }
          "OPENSSL_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
      - name: Build bundle
        run: bash runtime/build.sh bundle "${{ matrix.target }}" "${{ needs.common.outputs.version }}"
      - name: Smoke test
        run: |
          flags=()
          [ "${{ inputs.skip_services }}" = true ] && flags+=(--skip-services)
          bash runtime/smoke-test.sh "runtime/build/out/artel-runtime-${{ needs.common.outputs.version }}-${{ matrix.target }}.tar.gz" "${flags[@]+"${flags[@]}"}"
      - name: Size
        run: ls -l runtime/build/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-bundle-${{ matrix.target }}
          path: runtime/build/out/artel-runtime-*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: [common, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-bundle-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.common.outputs.version }}
        run: |
          ls -l dist
          (cd dist && sha256sum --check *.sha256)
          # --latest=false: electron-updater reads the latest release of this repository,
          # which must stay an app release, never a runtime release.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ARTEL runtime $VERSION" \
            --notes "Runtime bundle $VERSION. Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            --latest=false
