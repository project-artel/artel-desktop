name: Build runtime bundles

on:
  workflow_call:
    inputs:
      version:
        type: string
      orchestration_ref:
        type: string
      agent_server_ref:
        type: string
      home_ref:
        type: string
      skip_services:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.common.outputs.version }}

permissions:
  contents: read

env:
  ARTEL_ORCHESTRATION_REF: ${{ inputs.orchestration_ref || 'd7762bcb49de4fbeb22f327ed5336113aed91c35' }}
  ARTEL_AGENT_SERVER_REF: ${{ inputs.agent_server_ref || '8c5484d73121c10896616f8ec29aebc8eae175da' }}
  ARTEL_HOME_REF: ${{ inputs.home_ref || 'a297e6f1905f6a9270308403ecf2684819d61c90' }}

jobs:
  common:
    name: jar, home dist and agent-server source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Resolve version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/runtime-v* ]]; then
            version="${GITHUB_REF#refs/tags/runtime-v}"
          else
            version="${VERSION_INPUT:-0.0.0-ci.$GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build common parts
        run: bash runtime/build.sh common
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-common
          path: runtime/build/common
          retention-days: 3
          if-no-files-found: error

  bundle:
    name: bundle ${{ matrix.target }}
    needs: common
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          # macos-13 was retired in 2025; macos-15-intel is the remaining Intel image.
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-latest, msvc: x64 }
          - { target: win32-arm64, runner: windows-11-arm, msvc: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-common
          path: runtime/build/common
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/build/cache
          key: runtime-downloads-${{ matrix.target }}-${{ hashFiles('runtime/versions.env') }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Build static OpenSSL for Windows arm64
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = 'arm64-windows-static-md'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "openssl:$triplet" --classic
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          foreach ($file in @('include/openssl/ssl.h', 'lib/libssl.lib', 'lib/libcrypto.lib')) {
            if (!(Test-Path (Join-Path $opensslRoot $file))) {
              throw "OpenSSL build output missing: $file"
            }
          }
          "OPENSSL_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
      - name: Build bundle
        run: bash runtime/build.sh bundle "${{ matrix.target }}" "${{ needs.common.outputs.version }}"
      - name: Smoke test
        run: |
          flags=()
          [ "${{ inputs.skip_services }}" = true ] && flags+=(--skip-services)
          bash runtime/smoke-test.sh "runtime/build/out/artel-runtime-${{ needs.common.outputs.version }}-${{ matrix.target }}.tar.gz" "${flags[@]+"${flags[@]}"}"
      - name: Size
        run: ls -l runtime/build/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-bundle-${{ matrix.target }}
          path: runtime/build/out/artel-runtime-*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
