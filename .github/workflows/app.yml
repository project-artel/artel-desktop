name: app

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      runtime_archive_url:
        description: >-
          TODO(ARTEL-1145): base URL of the runtime archives, for example
          https://github.com/project-artel/artel-desktop/releases/download/runtime-v0.1.0
          The job appends artel-runtime-<version>-<target>.tar.gz. Leave empty to package
          with an empty runtime directory (installer config check only, the app will not start).
        required: false
        default: ''
      runtime_version:
        description: 'Runtime version used to build the archive file name, for example 0.1.0'
        required: false
        default: ''
      package:
        description: 'Build installers per OS'
        type: boolean
        default: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder_args: --linux --x64
            target: linux-x64
          - os: ubuntu-24.04-arm
            builder_args: --linux --arm64
            target: linux-arm64
          - os: macos-13
            builder_args: --mac --x64
            target: darwin-x64
          - os: macos-14
            builder_args: --mac --arm64
            target: darwin-arm64
          - os: windows-latest
            builder_args: --win --x64
            target: win32-x64
          - os: windows-11-arm
            builder_args: --win --arm64
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Signing is skipped when these secrets are absent.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Download runtime archive
        shell: bash
        env:
          RUNTIME_BASE_URL: ${{ inputs.runtime_archive_url }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/runtime-${{ matrix.target }}"
          mkdir -p "$dest"
          if [ -n "$RUNTIME_BASE_URL" ] && [ -n "$RUNTIME_VERSION" ]; then
            name="artel-runtime-${RUNTIME_VERSION}-${{ matrix.target }}.tar.gz"
            curl -fsSL -o "$RUNNER_TEMP/$name" "$RUNTIME_BASE_URL/$name"
            curl -fsSL -o "$RUNNER_TEMP/$name.sha256" "$RUNTIME_BASE_URL/$name.sha256"
            (cd "$RUNNER_TEMP" && (sha256sum -c "$name.sha256" 2>/dev/null || shasum -a 256 -c "$name.sha256"))
            tar -xzf "$RUNNER_TEMP/$name" -C "$dest" --strip-components=1
          else
            echo "No runtime archive URL given: packaging with an empty runtime directory."
            touch "$dest/.placeholder"
          fi
          echo "ARTEL_RUNTIME_SOURCE=$dest" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx electron-builder --config electron-builder.config.mjs ${{ matrix.builder_args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: artel-desktop-${{ matrix.target }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest*.yml
          if-no-files-found: error
