name: runtime

# Builds the ARTEL runtime bundle for six targets on native runners, smoke-tests each one,
# and on a runtime-v* tag attaches the archives to a GitHub release. See runtime/README.md.

on:
  push:
    tags:
      - 'runtime-v*'
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime.yml'
      - '.github/workflows/runtime-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default 0.0.0-ci.<run number>)'
        required: false
      orchestration_ref:
        description: 'artel-orchestration-server branch, tag or SHA'
        default: develop
      agent_server_ref:
        description: 'artel-agent-server branch, tag or SHA'
        default: develop
      home_ref:
        description: 'artel-home branch, tag or SHA'
        default: develop
      skip_services:
        description: 'Smoke-test postgres and pgvector only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/runtime-build.yml
    with:
      version: ${{ inputs.version || '' }}
      orchestration_ref: ${{ inputs.orchestration_ref || '' }}
      agent_server_ref: ${{ inputs.agent_server_ref || '' }}
      home_ref: ${{ inputs.home_ref || '' }}
      skip_services: ${{ inputs.skip_services == true }}

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-bundle-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l dist
          (cd dist && sha256sum --check *.sha256)
          # --latest=false: electron-updater reads the latest release of this repository,
          # which must stay an app release, never a runtime release.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ARTEL runtime $VERSION" \
            --notes "Runtime bundle $VERSION. Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            --latest=false
